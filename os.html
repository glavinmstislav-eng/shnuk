<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; frame-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Shnuk OS</title>
    <style>
        :root {
            --livebar-h: 44px;
            --accent: #cc0000;
            --accent-dark: #990000;
            --text-on-accent: #ffffff;
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #f0f0f0;
            --bg-hover: #fff5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --header-bg: #f5f5f5;
            --header-text: #1a1a1a;
            --livebar-bg: #ffffff;
            --livebar-text: #1a1a1a;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --apps-cols: 4;
            --dock-h: 0px;
        }
        html.pc-mode {
            --dock-h: 64px;
            --livebar-h: 0px;
        }
        [data-theme="evening"] {
            --accent: #cc0000;
            --accent-dark: #990000;
            --text-on-accent: #ffffff;
            --bg-primary: #2a2a2a;
            --bg-secondary: #333333;
            --bg-tertiary: #3a3a3a;
            --bg-hover: #3a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-muted: #999999;
            --border-color: #444444;
            --header-bg: #333333;
            --header-text: #ffffff;
            --livebar-bg: #2a2a2a;
            --livebar-text: #ffffff;
            --panel-bg: rgba(42, 42, 42, 0.9);
        }
        [data-theme="warm-night"] {
            --accent: #ffe066;
            --accent-dark: #e6c94d;
            --text-on-accent: #000000;
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #111111;
            --bg-hover: #1a1a00;
            --text-primary: #ffffff;
            --text-secondary: #dddddd;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --header-bg: #ffe066;
            --header-text: #000000;
            --livebar-bg: #000000;
            --livebar-text: #ffffff;
            --panel-bg: rgba(0, 0, 0, 0.9);
        }
        @font-face {
            font-family: 'TTPaplane';
            src: url('TT_Paplane_Trial_Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'TTPaplane';
            src: url('TT_Paplane_Trial_Regular.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: block;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'TTPaplane', monospace;
        }
        html, body {
            width: 100%; height: 100%;
            font-family: 'TTPaplane', monospace, sans-serif;
            font-size: 20px;
            touch-action: none; overflow: hidden;
            background: var(--bg-primary);
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            transition: background 0.4s ease, color 0.4s ease;
        }
        html, body, html *, body * {
            cursor: url('cursor.png') 4 4, auto !important;
        }
        html.locked-no-livebar #liveBar,
        html.locked-no-livebar #liveBarShade {
            display: none !important;
        }
        #osApp { display: none; position: relative; width: 100%; height: 100%; overflow: hidden; }
        #osApp.visible { display: block; }
        .app-background {
            position: absolute;
            top: var(--livebar-h, 44px); left: 0;
            width: 100%; height: calc(100% - var(--livebar-h, 44px));
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease, filter 0.35s ease, transform 0.35s ease, background-color 0.4s ease;
            z-index: 0;
            overflow: hidden;
            background-color: var(--bg-primary);
            touch-action: none;
        }
        .app-background.white-bg { background: var(--bg-primary) !important; transform: none !important; }
        .app-background.blurred { filter: blur(30px); transform: scale(1.15); }
        .bottom-panel {
            position: absolute;
            top: var(--livebar-h, 44px); left: 0;
            width: 100%; height: calc(100% - var(--livebar-h, 44px));
            z-index: 1;
            overflow-y: auto; overflow-x: hidden;
            padding: 30px 20px 200px;
            display: flex; flex-direction: column; align-items: center;
            -webkit-overflow-scrolling: touch;
            opacity: 1; pointer-events: all;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            will-change: opacity, transform;
            transform: scale(1);
            transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        background 0.4s ease;
        }
        .bottom-panel .close-apps {
            display: none;
        }
        .bottom-panel .bottom-blur {
            position: fixed;
            left: 0;
            right: 0;
            bottom: var(--dock-h, 0px);
            height: 110px;
            pointer-events: none;
            z-index: 22;
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            -webkit-mask-image: linear-gradient(to top, #000 0%, #000 40%, transparent 100%);
            mask-image: linear-gradient(to top, #000 0%, #000 40%, transparent 100%);
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        .bottom-panel h2 {
            font-size: 26px; font-weight: 700; color: var(--text-primary);
            margin-bottom: 24px; letter-spacing: -0.3px;
            z-index: 3;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(var(--apps-cols, 4), 1fr);
            grid-auto-rows: minmax(0, auto);
            gap: 20px 16px;
            max-width: 520px; width: 100%;
            z-index: 3;
            position: relative;
        }
        .icon-item {
            aspect-ratio: 1 / 1;
            background: transparent;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.2s ease; cursor: pointer;
            padding: 6px;
            border: none; outline: none;
            max-width: 90px; max-height: 90px;
            justify-self: center; width: 100%;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            opacity: 1;
            transform: none;
        }
        .bottom-panel.visible .icon-item {
            animation: iconRise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes iconRise {
            from { opacity: 0; transform: translateY(28px); filter: blur(8px); }
            to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
        }
        .icon-item:active { transform: scale(0.9); }
        .icon-item img { width: 80%; height: 80%; object-fit: contain; }
        .icon-item .icon-label {
            font-size: 13px; color: var(--text-primary); margin-top: 2px;
            text-align: center; line-height: 1.2;
            font-family: 'TTPaplane', monospace;
        }
        .icon-item .icon-default { font-size: 40px; line-height: 1; color: var(--text-primary); }
        .icon-item.html-app::after {
            content: 'HTML'; position: absolute; top: 0; left: 0;
            font-size: 10px; background: #4488ff; color: #fff;
            padding: 1px 5px; border-radius: 2px;
            font-weight: 700; letter-spacing: 0.5px;
        }
        .loader {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 20px; color: var(--text-muted); font-size: 18px;
            grid-column: 1 / -1;
        }
        .loader .spinner {
            width: 24px; height: 24px;
            border: 3px solid var(--border-color); border-top: 3px solid var(--accent);
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .html-app-window {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100001; background: var(--bg-primary);
            display: flex; flex-direction: column;
            padding-top: var(--livebar-h, 44px);
            box-sizing: border-box;
        }
        .html-app-window iframe { flex: 1; width: 100%; border: none; background: var(--bg-primary); }
        .html-app-close-btn {
            position: fixed; top: calc(var(--livebar-h, 44px) + 16px); right: 16px;
            width: 52px; height: 52px;
            background: var(--accent); color: var(--text-on-accent); border: none;
            font-size: 28px; cursor: pointer; z-index: 100002;
            font-family: 'TTPaplane', monospace;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(204,0,0,0.4);
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s ease;
        }
        .html-app-close-btn:hover { background: var(--accent-dark); transform: scale(1.1); }
        html.pc-mode .html-app-close-btn { display: none !important; }
        html.no-blur *,
        html.no-blur *::before,
        html.no-blur *::after {
            animation: none !important;
            transition: none !important;
            filter: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        @media (max-width: 500px) {
            html, body { font-size: 18px; }
            .bottom-panel { padding: 24px 16px 200px; }
            .bottom-panel h2 { font-size: 22px; margin-bottom: 18px; }
            .icon-grid { gap: 14px 12px; max-width: 100%; }
            .icon-item { padding: 4px; max-width: 72px; max-height: 72px; }
            .icon-item .icon-label { font-size: 11px; }
            .icon-item .icon-default { font-size: 32px; }
            .html-app-close-btn { top: calc(var(--livebar-h, 44px) + 12px); right: 12px; width: 46px; height: 46px; font-size: 24px; }
        }
    </style>

</head>
<body>

    <div id="osApp">
        <div class="app-background" id="appBackground"></div>

        <div class="bottom-panel" id="bottomPanel">
            <h2>Все приложения</h2>
            <div class="icon-grid" id="iconGrid">
                <div class="loader">
                    <span class="spinner"></span>
                    <span>Поиск</span>
                </div>
            </div>
            <div class="bottom-blur" id="bottomBlur"></div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        setTimeout(function() {
            try {
                if (window.history && window.history.replaceState) {
                    window.history.replaceState(null, '', window.location.pathname);
                }
            } catch(e) {}
        }, 1000);

        const osApp = document.getElementById('osApp');

        function loadScriptWithFallback(src) {
            return new Promise(function(resolve) {
                const timeoutId = setTimeout(function() {
                    resolve(false);
                }, 20000);
                const script = document.createElement('script');
                script.src = src + '?t=' + Date.now();
                script.async = false;
                script.onload = function() {
                    clearTimeout(timeoutId);
                    resolve(true);
                };
                script.onerror = function() {
                    clearTimeout(timeoutId);
                    resolve(false);
                };
                document.head.appendChild(script);
            });
        }

        function waitForOSStorage() {
            return new Promise(function(resolve) {
                if (window.OSStorage) { resolve(true); return; }
                let tries = 0;
                const iv = setInterval(function() {
                    tries++;
                    if (window.OSStorage || tries > 50) {
                        clearInterval(iv);
                        resolve(!!window.OSStorage);
                    }
                }, 100);
            });
        }

        const MIN_SCRIPTS = [
            'l10n.js',
            'l.js',
            'windows.js'
        ];

        const REST_SCRIPTS = [
            'onboarding.js',
            'live-bar.js',
            'app-scanner.js',
            'store.js',
            'settings.js',
            'cooop.js',
            'audio.js'
        ];

        const loadedScripts = Object.create(null);

        async function loadScriptsSequentially(list) {
            for (let i = 0; i < list.length; i++) {
                const src = list[i];
                if (loadedScripts[src]) continue;
                const ok = await loadScriptWithFallback(src);
                loadedScripts[src] = true;
                if (!ok) {
                    console.warn('[OS] Не удалось загрузить скрипт:', src);
                }
            }
        }

        async function launchOS() {
            osApp.classList.add('visible');
            osApp.style.display = 'block';

            try {
                if (localStorage.getItem('shnuk_blur_disabled') === 'true') {
                    document.documentElement.classList.add('no-blur');
                }
            } catch(e) {}

            await waitForOSStorage();
            await loadScriptsSequentially(MIN_SCRIPTS);
            await loadScriptsSequentially(REST_SCRIPTS);

            if (typeof window.initOS === 'function') window.initOS();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', launchOS);
        } else {
            launchOS();
        }
    })();
    </script>

    <script>
    window.initOS = function() {
        'use strict';
        if (typeof AppScanner === 'undefined') return;

        try {
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function() {
                    var loaded = document.fonts.check("400 16px 'TTPaplane'");
                    console.log('[Fonts] TTPaplane loaded:', loaded);
                });
            }
        } catch(e) {}

        window.confirmInstallWarning = function(options) {
            options = options || {};
            const name = options.name || 'приложение';
            const source = options.source || 'неизвестный источник';

            try {
                if (window.L && typeof window.L.playSound === 'function') {
                    window.L.playSound('window.mp3');
                } else if (typeof window.playSound === 'function') {
                    window.playSound('window.mp3');
                }
            } catch(e) {}

            return new Promise(function(resolve) {
                const overlay = document.createElement('div');
                overlay.id = 'installWarningOverlay';
                overlay.style.cssText = `
                    position: fixed;
                    inset: 0;
                    background: rgba(0,0,0,0.75);
                    -webkit-backdrop-filter: blur(8px);
                    backdrop-filter: blur(8px);
                    z-index: 2147483647;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 20px;
                    box-sizing: border-box;
                    animation: iwFadeIn 0.25s ease forwards;
                    font-family: 'TTPaplane', monospace;
                `;

                if (!document.getElementById('installWarningStyles')) {
                    const st = document.createElement('style');
                    st.id = 'installWarningStyles';
                    st.textContent = `
                        @keyframes iwFadeIn { from { opacity: 0; } to { opacity: 1; } }
                        @keyframes iwFadeOut { from { opacity: 1; } to { opacity: 0; } }
                    `;
                    document.head.appendChild(st);
                }

                const modal = document.createElement('div');
                modal.style.cssText = `
                    background: var(--bg-primary, #ffffff);
                    color: var(--text-primary, #1a1a1a);
                    width: 100%;
                    max-width: 480px;
                    border: 3px solid #cc0000;
                    padding: 0;
                    box-sizing: border-box;
                    display: flex;
                    flex-direction: column;
                    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
                    transform: scale(0.94);
                    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
                `;
                requestAnimationFrame(function() {
                    modal.style.transform = 'scale(1)';
                });

                const header = document.createElement('div');
                header.style.cssText = `
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    padding: 14px 18px;
                    background: #cc0000;
                    color: #ffffff;
                    border-bottom: 2px solid #990000;
                `;
                const icon = document.createElement('div');
                icon.textContent = '!';
                icon.style.cssText = `
                    width: 28px; height: 28px;
                    display: flex; align-items: center; justify-content: center;
                    background: #ffffff; color: #cc0000;
                    font-weight: 700; font-size: 18px;
                    border-radius: 50%;
                    flex-shrink: 0;
                `;
                header.appendChild(icon);
                const title = document.createElement('div');
                title.textContent = 'Внимание';
                title.style.cssText = 'font-size: 18px; font-weight: 700; letter-spacing: 0.4px;';
                header.appendChild(title);
                modal.appendChild(header);

                const body = document.createElement('div');
                body.style.cssText = `
                    padding: 20px 22px;
                    font-size: 15px;
                    line-height: 1.55;
                    color: var(--text-primary, #1a1a1a);
                `;
                body.innerHTML = `
                    <div style="margin-bottom: 12px;">
                        Вы собираетесь установить <b>${escapeHtml(name)}</b> из источника: <b>${escapeHtml(source)}</b>.
                    </div>
                    <div style="margin-bottom: 12px;">
                        Этот файл может быть <b style="color:#cc0000;">опасным</b>. Программа может получить доступ к вашим данным, файлам или системе.
                    </div>
                    <div>
                        Устанавливайте приложения <b>только из проверенных источников</b>.
                    </div>
                `;
                modal.appendChild(body);

                const actions = document.createElement('div');
                actions.style.cssText = `
                    display: flex;
                    gap: 10px;
                    padding: 14px 18px 18px;
                    border-top: 2px solid var(--border-color, #e0e0e0);
                    background: var(--bg-secondary, #f5f5f5);
                    flex-wrap: wrap;
                `;

                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = 'Отмена';
                cancelBtn.style.cssText = `
                    flex: 1;
                    min-width: 120px;
                    padding: 12px 20px;
                    border: 2px solid var(--border-color, #e0e0e0);
                    background: var(--bg-primary, #ffffff);
                    color: var(--text-primary, #1a1a1a);
                    cursor: pointer;
                    font-family: inherit;
                    font-size: 14px;
                    font-weight: 600;
                    transition: all 0.2s;
                `;
                cancelBtn.addEventListener('mouseenter', function() {
                    cancelBtn.style.borderColor = '#cc0000';
                    cancelBtn.style.color = '#cc0000';
                });
                cancelBtn.addEventListener('mouseleave', function() {
                    cancelBtn.style.borderColor = 'var(--border-color, #e0e0e0)';
                    cancelBtn.style.color = 'var(--text-primary, #1a1a1a)';
                });
                cancelBtn.addEventListener('click', function() { close(false); });
                actions.appendChild(cancelBtn);

                const okBtn = document.createElement('button');
                okBtn.textContent = 'Всё равно установить';
                okBtn.style.cssText = `
                    flex: 1;
                    min-width: 160px;
                    padding: 12px 20px;
                    border: 2px solid #cc0000;
                    background: #cc0000;
                    color: #ffffff;
                    cursor: pointer;
                    font-family: inherit;
                    font-size: 14px;
                    font-weight: 700;
                    letter-spacing: 0.3px;
                    transition: all 0.2s;
                `;
                okBtn.addEventListener('mouseenter', function() {
                    okBtn.style.background = '#990000';
                    okBtn.style.borderColor = '#990000';
                });
                okBtn.addEventListener('mouseleave', function() {
                    okBtn.style.background = '#cc0000';
                    okBtn.style.borderColor = '#cc0000';
                });
                okBtn.addEventListener('click', function() { close(true); });
                actions.appendChild(okBtn);

                modal.appendChild(actions);
                overlay.appendChild(modal);
                document.body.appendChild(overlay);

                function close(result) {
                    overlay.style.animation = 'iwFadeOut 0.2s ease forwards';
                    setTimeout(function() {
                        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                    }, 220);
                    resolve(result);
                }

                const onKey = function(e) {
                    if (e.key === 'Escape') {
                        document.removeEventListener('keydown', onKey);
                        close(false);
                    }
                };
                document.addEventListener('keydown', onKey);
            });
        };

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        const app = document.getElementById('osApp');
        const appBackground = document.getElementById('appBackground');
        const bottomPanel = document.getElementById('bottomPanel');
        const iconGrid = document.getElementById('iconGrid');

        let allApps = [];
        let isAppAnimating = false;
        let appsOrderSnapshot = null;
        const INSTALLED_KEY = 'shnuk_installed_apps';
        const THEME_KEY = 'shnuk_theme';
        const SCREEN_SETTINGS_KEY = 'shnuk_screen_settings';

        const lastOpenIconRects = {};

        const APP_DESTROY_MAP = {
            'myShnukApp': 'MyShnuk',
            'settingsApp': 'Settings',
            'fileApp': 'FileApp',
            'timeApp': 'Time',
            'storeApp': 'Store',
            'cameraApp': 'Camera',
            'recorderApp': 'Recorder',
            'cooopApp': 'Cooop',
            'gameCenterApp': 'GameCenter',
            'collApp': 'Collaris',
            'browserApp': 'Browser',
            'shnukAccountApp': 'ShnukAccount'
        };

        const APP_DOM_MAP = {
            'my-shnuk': 'myShnukApp',
            'settings': 'settingsApp',
            'time': 'timeApp',
            'store': 'storeApp',
            'cooop': 'cooopApp',
            'coll': 'collApp',
            'browser': 'browserApp',
            'shnuk-account': 'shnukAccountApp'
        };

        window.__notificationOpenedAppId = window.__notificationOpenedAppId || null;

        function T(s) {
            if (window.L10N && typeof window.L10N.t === 'function') return window.L10N.t(s);
            return s;
        }

        function loadScreenSettings() {
            const defaults = {
                appsCols: 4,
                appsRows: 3
            };
            try {
                const raw = localStorage.getItem(SCREEN_SETTINGS_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return Object.assign(defaults, parsed);
                }
            } catch(e) {}
            return defaults;
        }

        function applyScreenSettings() {
            const s = loadScreenSettings();
            document.documentElement.style.setProperty('--apps-cols', String(s.appsCols));
        }

        function getAppData(appId) { return allApps.find(a => a.id === appId); }
        function getAppIcon(appId) { const a = getAppData(appId); return a && a.icon ? a.icon : null; }
        function getAppName(appId) { const a = getAppData(appId); return a ? a.name : appId; }
        function makeOrderSnapshot() { appsOrderSnapshot = allApps.map(a => a.id); }
        function applyOrderSnapshot(apps) {
            if (!appsOrderSnapshot || appsOrderSnapshot.length === 0) return apps;
            const appMap = new Map();
            apps.forEach(a => appMap.set(a.id, a));
            const ordered = [];
            for (const id of appsOrderSnapshot) {
                if (appMap.has(id)) { ordered.push(appMap.get(id)); appMap.delete(id); }
            }
            for (const [, a] of appMap) ordered.push(a);
            return ordered;
        }

        function findOpenAppElement(appId) {
            const domId = APP_DOM_MAP[appId];
            if (domId) {
                const el = document.getElementById(domId);
                if (el && el.parentNode) return el;
            }
            const direct = document.getElementById(appId);
            if (direct && direct.parentNode) return direct;
            const guess = document.getElementById(appId + 'App');
            if (guess && guess.parentNode) return guess;
            const htmlWin = document.querySelector('.html-app-window[data-app-id="' + appId + '"]');
            if (htmlWin) return htmlWin;
            return null;
        }

        function closeAllApps(keepAppId) {
            const keys = Object.keys(APP_DOM_MAP);
            keys.forEach(function(key) {
                if (key === keepAppId) return;
                const domId = APP_DOM_MAP[key];
                const el = document.getElementById(domId);
                if (!el) return;
                const objName = APP_DESTROY_MAP[domId];
                if (objName && window[objName] && typeof window[objName].destroy === 'function') {
                    try { window[objName].destroy(); return; } catch(e) {}
                }
                try { if (el.parentNode) el.parentNode.removeChild(el); } catch(e) {}
            });
        }

        function bringToFront(el) {
            if (!el) return;
            try {
                const currentZ = parseInt(el.style.zIndex, 10) || 99999;
                el.style.zIndex = String(Math.max(currentZ, 99999) + 1);
            } catch(e) {}
        }

        window.ShnukCloseAnimation = function(targetEl, appId, onDone) {
            if (!targetEl) { if (onDone) onDone(); return; }
            const startRect = targetEl.getBoundingClientRect();
            if (startRect.width === 0 || startRect.height === 0) { if (onDone) onDone(); return; }
            const wasOpenedFromNotification = (appId && window.__notificationOpenedAppId === appId);
            targetEl.style.transformOrigin = 'center center';
            targetEl.style.willChange = 'transform, opacity, filter';
            targetEl.style.pointerEvents = 'none';
            targetEl.style.transition = 'none';
            const distanceY = window.innerHeight - startRect.top + 40;
            const duration = 380;
            const startTime = performance.now();
            function animateMenu(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                const ty = distanceY * ease;
                const sc = 1 - 0.12 * ease;
                const blur = t * 12;
                const opacity = 1 - Math.pow(t, 1.6);
                targetEl.style.transform = 'translateY(' + ty + 'px) scale(' + sc + ')';
                targetEl.style.opacity = String(opacity);
                targetEl.style.filter = 'blur(' + blur + 'px)';
                if (t < 1) requestAnimationFrame(animateMenu);
                else {
                    if (targetEl.parentNode) targetEl.parentNode.removeChild(targetEl);
                    if (wasOpenedFromNotification) window.__notificationOpenedAppId = null;
                    if (onDone) onDone();
                }
            }
            requestAnimationFrame(animateMenu);
        };

        function openAppWithAnimation(appId, startRect, fromMenu) {
            if (window.__cooopGuestActive) {
                if (window.Win && window.Win.notify) window.Win.notify(T('В режиме Cooop приложения недоступны'), { type: 'info' });
                return;
            }
            const appData = getAppData(appId);
            if (!appData) return;

            if (window.PCWindows && window.PCWindows.isActive && window.PCWindows.isActive()) {
                if (window.PCWindows.openWindowsMap && window.PCWindows.openWindowsMap.has(appId)) {
                    const state = window.PCWindows.openWindowsMap.get(appId);
                    if (state.isMinimized && state.dockIconEl) {
                        state.dockIconEl.click();
                    } else if (state.el) {
                        state.el.style.zIndex = String(Date.now() % 1000000 + 100100);
                        window.PCWindows.openWindowsMap.forEach(function(other) {
                            if (other.el) other.el.classList.remove('active');
                        });
                        state.el.classList.add('active');
                    }
                    return;
                }
                if (appData.type === 'html') { openHtmlAppPCMode(appData); return; }
                const script = document.createElement('script');
                script.src = appData.file + '?t=' + Date.now();
                script.onload = function() {
                    if (typeof window[appData.id + 'Init'] === 'function') window[appData.id + 'Init']();
                    else if (typeof window[appData.id.replace(/-/g, '') + 'Init'] === 'function') window[appData.id.replace(/-/g, '') + 'Init']();
                };
                document.head.appendChild(script);
                return;
            }

            const alreadyOpen = findOpenAppElement(appId);
            if (alreadyOpen) {
                bringToFront(alreadyOpen);
                try {
                    const prevTransition = alreadyOpen.style.transition;
                    alreadyOpen.style.transition = 'filter 0.25s ease';
                    alreadyOpen.style.filter = 'brightness(1.15)';
                    setTimeout(function() {
                        alreadyOpen.style.filter = '';
                        alreadyOpen.style.transition = prevTransition;
                    }, 250);
                } catch(e) {}
                return;
            }

            closeAllApps(appId);
            isAppAnimating = true;

            if (window.__appOpenedFrom !== 'notification') {
                window.__appOpenedFrom = fromMenu ? 'menu' : 'desktop';
            }

            let iconPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            let iconRect = null;
            if (startRect && (startRect.width > 0 || startRect.height > 0)) {
                iconPos = { x: startRect.left + startRect.width / 2, y: startRect.top + startRect.height / 2 };
                iconRect = { left: startRect.left, top: startRect.top, width: startRect.width, height: startRect.height };
            } else {
                const btn = document.querySelector('.icon-item[data-app-id="' + appId + '"]');
                if (btn) {
                    const r = btn.getBoundingClientRect();
                    if (r.width > 0 || r.height > 0) {
                        iconPos = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
                        iconRect = { left: r.left, top: r.top, width: r.width, height: r.height };
                    }
                }
            }
            if (iconRect) lastOpenIconRects[appId] = iconRect;

            const backdrop = document.createElement('div');
            backdrop.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:99998;background:rgba(0,0,0,0);backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);transition:all .3s cubic-bezier(.22,1,.36,1);pointer-events:none;';
            document.body.appendChild(backdrop);
            appBackground.classList.add('blurred');
            requestAnimationFrame(() => {
                backdrop.style.background = 'rgba(0,0,0,.5)';
                backdrop.style.backdropFilter = 'blur(20px)';
                backdrop.style.webkitBackdropFilter = 'blur(20px)';
            });

            const launchContainer = document.createElement('div');
            launchContainer.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;pointer-events:none;';
            const flyIcon = document.createElement('div');
            flyIcon.style.cssText = `
                position:absolute;width:80px;height:80px;
                display:flex;align-items:center;justify-content:center;
                left:${iconPos.x - 40}px;top:${iconPos.y - 40}px;
                filter:blur(0px);opacity:1;
            `;
            const iconSrc = getAppIcon(appId);
            if (iconSrc) {
                const img = document.createElement('img');
                img.src = iconSrc;
                img.style.cssText = 'width:100%;height:100%;object-fit:contain;';
                flyIcon.appendChild(img);
            } else {
                flyIcon.textContent = getAppName(appId).charAt(0);
                flyIcon.style.cssText += 'font-size:32px;font-weight:bold;color:#fff;';
            }
            launchContainer.appendChild(flyIcon);
            document.body.appendChild(launchContainer);

            const startX = iconPos.x - 40;
            const startY = iconPos.y - 40;
            const endX = window.innerWidth / 2 - 60;
            const endY = window.innerHeight / 2 - 60;
            const duration = 380;
            const startTime = performance.now();

            function animateIcon(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                const x = startX + (endX - startX) * ease;
                const y = startY + (endY - startY) * ease;
                const scale = 1 + progress * 0.5;
                const blur = progress * 15;
                flyIcon.style.left = x + 'px';
                flyIcon.style.top = y + 'px';
                flyIcon.style.transform = `scale(${scale})`;
                flyIcon.style.filter = `blur(${blur}px)`;
                flyIcon.style.opacity = 1 - progress * 0.5;
                if (progress < 1) requestAnimationFrame(animateIcon);
                else {
                    setTimeout(() => {
                        launchContainer.remove();
                        backdrop.style.opacity = '0';
                        setTimeout(() => backdrop.remove(), 300);
                        appBackground.classList.remove('blurred');
                        isAppAnimating = false;
                        if (appData.type === 'html') openHtmlApp(appData);
                        else {
                            const script = document.createElement('script');
                            script.src = appData.file + '?t=' + Date.now();
                            script.onload = function() {
                                if (typeof window[appData.id + 'Init'] === 'function') window[appData.id + 'Init']();
                                else if (typeof window[appData.id.replace(/-/g, '') + 'Init'] === 'function') window[appData.id.replace(/-/g, '') + 'Init']();
                            };
                            document.head.appendChild(script);
                        }
                    }, 100);
                }
            }
            requestAnimationFrame(animateIcon);
        }

        window.ShnukOpenAppById = function(appId, appName) {
            if (!appId && !appName) return false;
            if (appId && window.PCWindows && window.PCWindows.isActive && window.PCWindows.isActive()) {
                if (window.PCWindows.openWindowsMap && window.PCWindows.openWindowsMap.has(appId)) {
                    const state = window.PCWindows.openWindowsMap.get(appId);
                    if (state.isMinimized && state.dockIconEl) state.dockIconEl.click();
                    else if (state.el) state.el.style.zIndex = String(Date.now() % 1000000 + 100100);
                    return true;
                }
            }
            let appData = null;
            if (appId) appData = getAppData(appId);
            if (!appData && appName) appData = allApps.find(a => a.name === appName);
            if (!appData) {
                if (window.AppScanner && AppScanner.getApps) {
                    AppScanner.getApps().then(function(apps) {
                        let found = null;
                        if (appId) found = apps.find(a => a.id === appId);
                        if (!found && appName) found = apps.find(a => a.name === appName);
                        if (!found) return;
                        window.__appOpenedFrom = 'notification';
                        window.__notificationOpenedAppId = found.id;
                        if (found.type === 'html') openHtmlAppPCMode(found);
                        else if (found.file) {
                            const script = document.createElement('script');
                            script.src = found.file + '?t=' + Date.now();
                            script.onload = function() {
                                const initFn = window[found.id + 'Init'] || window[found.id.replace(/-/g, '') + 'Init'];
                                if (typeof initFn === 'function') { try { initFn(); } catch(e) {} }
                            };
                            document.head.appendChild(script);
                        }
                    }).catch(function() {});
                }
                return false;
            }
            window.__appOpenedFrom = 'notification';
            window.__notificationOpenedAppId = appData.id;
            if (appData.type === 'html') { openHtmlApp(appData); return true; }
            openAppWithAnimation(appData.id, null, false);
            return true;
        };

        function openHtmlAppPCMode(appData) {
            if (!appData || !appData.html) return;
            const existing = document.querySelector('.html-app-window[data-app-id="' + appData.id + '"]');
            if (existing) {
                if (window.PCWindows && window.PCWindows.isActive && window.PCWindows.isActive()) {
                    const state = window.PCWindows.openWindowsMap && window.PCWindows.openWindowsMap.get(appData.id);
                    if (state && state.el) state.el.style.zIndex = String(Date.now() % 1000000 + 100100);
                }
                return;
            }
            const token = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : 'tok_' + Date.now() + '_' + Math.random().toString(36).slice(2);
            const container = document.createElement('div');
            container.className = 'html-app-window';
            container.dataset.appId = appData.id;
            const iframe = document.createElement('iframe');
            iframe.sandbox = 'allow-scripts allow-forms allow-popups allow-modals';
            iframe.name = token;
            let html = appData.html;
            const tokenScript = '<script>window.__collToken=' + JSON.stringify(token) + ';<\/script>';
            if (/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, function(m) { return m + tokenScript; });
            else html = tokenScript + html;
            iframe.srcdoc = html;
            container.appendChild(iframe);
            document.body.appendChild(container);
            if (!window.__collTokens) window.__collTokens = {};
            window.__collTokens[token] = { appId: appData.id, created: Date.now() };
            const onMessage = function(e) {
                const d = e.data;
                if (!d || !d.__coll) return;
                if (!d.token || !window.__collTokens[d.token]) return;
                if (d.type === 'notify') {
                    if (window.LiveBar && typeof window.LiveBar.notify === 'function') {
                        window.LiveBar.notify({
                            title: d.data.title || '',
                            body: d.data.body || '',
                            type: d.data.type || 'info',
                            appId: appData.id,
                            appName: appData.name || ''
                        });
                    }
                }
            };
            window.addEventListener('message', onMessage);
            container.__onMessage = onMessage;
        }

        function openHtmlApp(appData) {
            if (!appData || !appData.html) return;
            const existing = document.querySelector('.html-app-window[data-app-id="' + appData.id + '"]');
            if (existing) {
                bringToFront(existing);
                try {
                    const prev = existing.style.transition;
                    existing.style.transition = 'filter 0.25s ease';
                    existing.style.filter = 'brightness(1.15)';
                    setTimeout(function() {
                        existing.style.filter = '';
                        existing.style.transition = prev;
                    }, 250);
                } catch(e) {}
                return;
            }
            const token = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : 'tok_' + Date.now() + '_' + Math.random().toString(36).slice(2);
            const container = document.createElement('div');
            container.className = 'html-app-window';
            container.dataset.appId = appData.id;
            const closeBtn = document.createElement('button');
            closeBtn.className = 'html-app-close-btn';
            closeBtn.textContent = '✕';
            closeBtn.addEventListener('click', function() {
                window.ShnukCloseAnimation(container, appData.id, function() {
                    if (closeBtn.parentNode) closeBtn.parentNode.removeChild(closeBtn);
                    try { delete window.__collTokens[token]; } catch(e) {}
                    try { window.removeEventListener('message', onMessage); } catch(e) {}
                });
            });
            const iframe = document.createElement('iframe');
            iframe.sandbox = 'allow-scripts allow-forms allow-popups allow-modals';
            iframe.name = token;
            let html = appData.html;
            const tokenScript = '<script>window.__collToken=' + JSON.stringify(token) + ';<\/script>';
            if (/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, function(m) { return m + tokenScript; });
            else html = tokenScript + html;
            iframe.srcdoc = html;
            container.appendChild(iframe);
            document.body.appendChild(container);
            document.body.appendChild(closeBtn);
            if (!window.__collTokens) window.__collTokens = {};
            window.__collTokens[token] = { appId: appData.id, created: Date.now() };
            const onMessage = function(e) {
                const d = e.data;
                if (!d || !d.__coll) return;
                if (!d.token || !window.__collTokens[d.token]) return;
                if (d.type === 'notify') {
                    if (window.LiveBar && typeof window.LiveBar.notify === 'function') {
                        window.LiveBar.notify({
                            title: d.data.title || '',
                            body: d.data.body || '',
                            type: d.data.type || 'info',
                            appId: appData.id,
                            appName: appData.name || ''
                        });
                    }
                }
            };
            window.addEventListener('message', onMessage);
            container.__onMessage = onMessage;
            const onEsc = function(e) {
                if (e.key === 'Escape') {
                    window.ShnukCloseAnimation(container, appData.id, function() {
                        if (closeBtn.parentNode) closeBtn.parentNode.removeChild(closeBtn);
                        window.removeEventListener('message', onMessage);
                        try { delete window.__collTokens[token]; } catch(e) {}
                    });
                    document.removeEventListener('keydown', onEsc);
                }
            };
            document.addEventListener('keydown', onEsc);
        }

        function loadApps() {
            AppScanner.scan().then(function(apps) {
                allApps = apps;
                makeOrderSnapshot();
                renderAllApps();
                applyScreenSettings();
                if (window.LiveBar && window.LiveBar.restore) window.LiveBar.restore();
            }).catch(function(err) {
                iconGrid.innerHTML = '<span style="color:#cc0000;">' + T('Ошибка') + '</span>';
            });
        }

        function refreshApps() {
            if (typeof AppScanner !== 'undefined' && AppScanner.rescan) {
                AppScanner.rescan().then(function(apps) {
                    allApps = applyOrderSnapshot(apps);
                    const newIds = apps.filter(a => !appsOrderSnapshot.includes(a.id)).map(a => a.id);
                    if (newIds.length > 0) appsOrderSnapshot = allApps.map(a => a.id);
                    renderAllApps();
                });
            }
        }
        window.refreshApps = refreshApps;
        window.rescanApps = refreshApps;

        function renderAllApps() {
            iconGrid.innerHTML = '';
            if (allApps.length === 0) {
                iconGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);font-size:18px;">' + T('Нет приложений') + '</div>';
                return;
            }
            const sortedApps = appsOrderSnapshot ? applyOrderSnapshot(allApps) : allApps;
            let idx = 0;
            sortedApps.forEach(function(a) {
                const div = document.createElement('div');
                div.className = 'icon-item';
                if (a.type === 'html') div.classList.add('html-app');
                div.dataset.appId = a.id;
                div.dataset.appName = a.name;
                div.style.animationDelay = (Math.min(idx, 24) * 0.025) + 's';
                idx++;
                if (a.icon) {
                    const img = document.createElement('img');
                    img.src = a.icon;
                    img.alt = a.name;
                    div.appendChild(img);
                } else {
                    const fallback = document.createElement('span');
                    fallback.className = 'icon-default';
                    fallback.textContent = a.name.charAt(0);
                    div.appendChild(fallback);
                }
                const label = document.createElement('span');
                label.className = 'icon-label';
                label.textContent = a.name.length > 10 ? a.name.substring(0, 10) + '…' : a.name;
                div.appendChild(label);
                div.addEventListener('click', function(e) {
                    if (isAppAnimating) return;
                    const appId = a.id;
                    const rect = div.getBoundingClientRect();
                    openAppWithAnimation(appId, rect, true);
                });
                iconGrid.appendChild(div);
            });
        }

        function isFullscreen() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
        }
        function enterFullscreen() {
            const el = document.documentElement;
            try {
                if (el.requestFullscreen) return el.requestFullscreen();
                if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
                if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
                if (el.msRequestFullscreen) return el.msRequestFullscreen();
            } catch(e) {}
            return Promise.reject('not supported');
        }
        function ensureFullscreen() {
            if (isFullscreen()) return;
            let wantFullscreen = true;
            try { wantFullscreen = localStorage.getItem('shnuk_fullscreen') !== 'false'; } catch(e) {}
            if (wantFullscreen) enterFullscreen().catch(function() {});
        }
        setInterval(ensureFullscreen, 1000);
        document.addEventListener('fullscreenchange', function() {
            if (!isFullscreen()) {
                let wantFullscreen = true;
                try { wantFullscreen = localStorage.getItem('shnuk_fullscreen') !== 'false'; } catch(e) {}
                if (wantFullscreen) setTimeout(ensureFullscreen, 100);
            }
        });
        document.addEventListener('webkitfullscreenchange', function() {
            if (!isFullscreen()) {
                let wantFullscreen = true;
                try { wantFullscreen = localStorage.getItem('shnuk_fullscreen') !== 'false'; } catch(e) {}
                if (wantFullscreen) setTimeout(ensureFullscreen, 100);
            }
        });
        document.addEventListener('click', ensureFullscreen, { once: true });
        document.addEventListener('touchstart', ensureFullscreen, { once: true });
        document.addEventListener('keydown', ensureFullscreen, { once: true });

        if ('wakeLock' in navigator) {
            let wakeLock = null;
            const requestWakeLock = async function() {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
            };
            requestWakeLock();
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && !wakeLock) requestWakeLock();
            });
        }

        function applyTheme(themeId) {
            const theme = themeId || 'day';
            if (theme === 'day') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', theme);
        }

        function applyWallpaperFromStorage() {
            let url = null;
            let themeId = 'day';
            try { url = localStorage.getItem('app_wallpaper'); } catch(e) {}
            try { themeId = localStorage.getItem(THEME_KEY) || 'day'; } catch(e) {}
            if (!url) {
                url = 'wall1.png';
                try {
                    localStorage.setItem('app_wallpaper', url);
                    localStorage.setItem('shnuk_wallpaper', url);
                    localStorage.setItem('shnuk_wallpaper_name', 'Яркий день');
                } catch(e) {}
            }
            applyTheme(themeId);
            appBackground.dataset.staticWallpaper = url;
            appBackground.style.backgroundImage = 'url(\'' + url + '\')';
        }

        window.addEventListener('shnuk:wallpaper-changed', function() { applyWallpaperFromStorage(); });
        window.addEventListener('shnuk:theme-changed', function() {
            let themeId = 'day';
            try { themeId = localStorage.getItem(THEME_KEY) || 'day'; } catch(e) {}
            applyTheme(themeId);
        });
        window.addEventListener('storage', function(e) {
            if (e.key === 'app_wallpaper') applyWallpaperFromStorage();
            if (e.key === THEME_KEY) {
                let themeId = 'day';
                try { themeId = localStorage.getItem(THEME_KEY) || 'day'; } catch(e) {}
                applyTheme(themeId);
            }
        });

        let lastInstalledHash = '';
        try { lastInstalledHash = localStorage.getItem(INSTALLED_KEY) || ''; } catch(e) {}
        setInterval(function() {
            let installedRaw = '';
            try { installedRaw = localStorage.getItem(INSTALLED_KEY) || ''; } catch(e) {}
            if (installedRaw !== lastInstalledHash) {
                lastInstalledHash = installedRaw;
                refreshApps();
            }
        }, 2000);

        applyWallpaperFromStorage();
        applyScreenSettings();

        loadApps();
        setTimeout(ensureFullscreen, 500);
    };
    </script>

    <script>
    (function() {
        var PRELOAD_IMAGES = [
            'wall1.png', 'wall2.png', 'wall3.png',
            'settings.png', 'time.png',
            'store.png', 'cooop.png', 'games.png', 'coll.png', 'myshnuk.png',
            'cursor.png'
        ];
        PRELOAD_IMAGES.forEach(function(src) {
            try { var img = new Image(); img.src = src; } catch(e) {}
        });
    })();
    </script>
